# ---- Nombre de la aplicación ----
spring.application.name=crud-empleados

# ---- Conexión a PostgreSQL ----
# Los valores vienen de variables de entorno, así las credenciales NO quedan escritas en el código.
# Solo la URL tiene valor por defecto (base local del taller).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/empleados_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate ----
# "update" crea o ajusta las tablas automáticamente según las entidades Java.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Evita que Hibernate mantenga la conexión abierta durante la respuesta HTTP (buena práctica).
spring.jpa.open-in-view=false

# ---- Respuestas de error ----
# No mostrar stacktraces ni mensajes internos al cliente.
server.error.include-stacktrace=never
server.error.include-message=never
